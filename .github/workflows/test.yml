name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Taipei

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Verify .nvmrc
        run: |
          if [ "$(cat .nvmrc)" != "${{ matrix.node-version }}" ]; then
            echo "::error::.nvmrc version does not match matrix"
            exit 1
          fi